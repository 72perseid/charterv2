name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: charter
          POSTGRES_USER: charter
          POSTGRES_PASSWORD: charter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U charter -d charter"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci
      FERNET_KEY: ci
      DATABASE_URL: postgres://charter:charter@localhost:5432/charter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - run: ruff check backend && ruff format --check backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: cd backend && pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yml build
        env:
          POSTGRES_PASSWORD: ci
