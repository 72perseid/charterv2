[project]
name = "charter"
version = "0.1.0"
description = "Chart-er: tabular data and a sentence in, a Vega-Lite chart and its full provenance out."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "pyarrow>=17",
    "httpx>=0.27,<1",
    "cryptography>=43",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["charter", "accounts", "datasets", "generation", "charts"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "charter.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# DJ001: SPEC §5 makes sheet_name and error_message nullable on purpose (null = not applicable).
ignore = ["DJ001"]
